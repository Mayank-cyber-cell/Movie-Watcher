<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MovieWatcher - Your Ultimate Movie Search Platform" />
    <title>MovieWatcher</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-MSqtGkir.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-j6LxivXP.css">
  </head>
  <body>
    <!-- App Container -->
    <div id="app">
      
      <!-- Header & Search -->
      <header class="navbar">
        <div class="logo">MovieWatcher</div>
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Search for movies..." autocomplete="off">
          <button id="search-button" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Section Title (e.g., Trending Movies, Search Results) -->
        <h1 id="section-title">Trending Movies</h1>
        <div id="loading-spinner" class="spinner hidden"></div>
        <div id="error-message" class="error-message hidden"></div>
        <!-- Movie Grid -->
        <div id="movie-grid" class="movie-grid">
          <!-- Movie cards will be injected here by JS -->
        </div>
      </main>

      <!-- Movie Details Modal -->
      <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
          <button id="close-modal" class="close-btn" aria-label="Close modal">&times;</button>
          
          <div class="modal-body">
            <div class="modal-poster">
              <img id="modal-img" src="" alt="Movie Poster">
              <button id="favorite-btn" class="favorite-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="heart-icon"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span>Add to Favorites</span>
              </button>
            </div>
            
            <div class="modal-info">
              <h2 id="modal-title">Movie Title</h2>
              <div class="modal-meta">
                <span id="modal-date" class="meta-item">2023</span>
                <span id="modal-rating" class="meta-item rating-imdb"><span class="imdb-badge">IMDb</span> <span id="imdb-score">N/A</span></span>
                <span id="modal-tmdb-rating" class="meta-item rating-tmdb"><span class="tmdb-badge">TMDb</span> <span id="tmdb-score">N/A</span></span>
              </div>
              
              <div class="modal-tags" id="modal-genres">
                <!-- Genres injected here -->
              </div>

              <h3>Overview</h3>
              <p id="modal-overview">Movie overview text...</p>
              
              <h3>Top Cast</h3>
              <div id="modal-cast" class="cast-list">
                <!-- Cast injected here -->
              </div>
            </div>
          </div>

          <div class="modal-trailer" id="trailer-container">
            <h3>Trailer</h3>
            <div class="iframe-wrapper">
              <iframe id="trailer-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
          
          <div class="modal-similar" id="similar-container">
            <h3>Similar Movies</h3>
            <div id="similar-grid" class="similar-grid">
              <!-- Similar movies injected here -->
            </div>
          </div>

        </div>
      </div>
    </div>
    
  </body>
</html>
